name: Maintainability checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deterministic build, syntax, documentation links
        run: python3 scripts/check.py
      - name: Run simulation and contract suites
        run: python3 scripts/test.py
      - name: Install optional browser tooling
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Run Chromium browser smoke
        run: python3 scripts/test.py --browser-only
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

# This workflow verifies changes. Existing branch-based GitHub Pages deployment
# is intentionally unchanged; verification is not currently a deployment gate.
